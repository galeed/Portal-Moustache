<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beatportal Concept</title>
  <!-- Supabase JS Client desde CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-main: #111111;
      --text-muted: #707070;
      --border-color: #e5e5e5;
      --accent-black: #000000;
      --error-color: #e53e3e;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      padding-bottom: 80px;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      background: var(--bg-color);
      z-index: 10;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }

    .logo span {
      background: var(--accent-black);
      color: #fff;
      padding: 2px 6px;
      margin-left: 2px;
    }

    .auth-btn {
      background: var(--accent-black);
      color: #fff;
      border: none;
      padding: 10px 18px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      border-radius: 2px;
      transition: opacity 0.2s;
    }

    .auth-btn:hover {
      opacity: 0.85;
    }

    /* Main Layout */
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .hero-title {
      font-size: 2.2rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      margin-bottom: 32px;
      font-size: 0.95rem;
    }

    /* Grid de Contenido */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
    }

    .card {
      border: 1px solid var(--border-color);
      padding: 16px;
      background: #fff;
    }

    .card-img {
      width: 100%;
      aspect-ratio: 1/1;
      background-color: #f0f0f0;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      font-weight: 700;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .card-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* Barra Fija Inferior */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background-color: var(--bg-color);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 20;
    }

    .nav-item {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .nav-item.active {
      color: var(--text-main);
    }

    /* Modal de Inicio de Sesión */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      width: 100%;
      max-width: 380px;
      padding: 32px;
      border: 1px solid var(--border-color);
      background: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      font-weight: 700;
    }

    .modal-title {
      font-size: 1.4rem;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--text-main);
    }

    .submit-btn {
      width: 100%;
      background: var(--text-main);
      color: #fff;
      border: none;
      padding: 14px;
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      margin-top: 8px;
    }

    .error-msg {
      color: var(--error-color);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">BEATPORT<span>AL</span></div>
    <button class="auth-btn" id="authBtn">Iniciar Sesión</button>
  </header>

  <!-- Contenido principal -->
  <main>
    <h1 class="hero-title">Mi Perfil</h1>
    <p class="subtitle" id="userStatus">Inicia sesión para acceder a tus tracks y colecciones.</p>

    <div class="grid">
      <div class="card">
        <div class="card-img">Artwork 1:1</div>
        <div class="card-title">Track Title</div>
        <div class="card-meta">Artist • Genre</div>
      </div>
      <div class="card">
        <div class="card-img">Artwork 1:1</div>
        <div class="card-title">Release Title</div>
        <div class="card-meta">Label • 128 BPM</div>
      </div>
      <div class="card">
        <div class="card-img">Artwork 1:1</div>
        <div class="card-title">Playlist</div>
        <div class="card-meta">12 Tracks</div>
      </div>
    </div>
  </main>

  <!-- Barra inferior -->
  <nav class="bottom-bar">
    <button class="nav-item active">
      <span>Explorar</span>
    </button>
    <button class="nav-item">
      <span>Top 100</span>
    </button>
    <button class="nav-item">
      <span>Lanzamientos</span>
    </button>
    <button class="nav-item" id="bottomProfileBtn">
      <span>Perfil</span>
    </button>
  </nav>

  <!-- Modal de Login -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-box">
      <button class="close-btn" id="closeAuth">&times;</button>
      <h2 class="modal-title">Acceso</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" required placeholder="tu@email.com">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">Entrar</button>
        <div class="error-msg" id="errorMsg"></div>
      </form>
    </div>
  </div>

  <script>
    // 1. CONFIGURACIÓN DE SUPABASE
    // Reemplaza estas dos constantes con los datos de tu Dashboard de Supabase:
    const SUPABASE_URL = 'https://TU-PROYECTO.supabase.co';
    const SUPABASE_ANON_KEY = 'TU-CLAVE-ANON-PUBLICA';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Elementos DOM
    const authModal = document.getElementById('authModal');
    const authBtn = document.getElementById('authBtn');
    const closeAuthBtn = document.getElementById('closeAuth');
    const bottomProfileBtn = document.getElementById('bottomProfileBtn');
    const loginForm = document.getElementById('loginForm');
    const userStatus = document.getElementById('userStatus');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    let currentUser = null;

    // Abrir/Cerrar Modal
    const toggleModal = () => {
      errorMsg.style.display = 'none';
      authModal.classList.toggle('open');
    };

    closeAuthBtn.addEventListener('click', toggleModal);
    bottomProfileBtn.addEventListener('click', () => {
      if (!currentUser) toggleModal();
    });
    authModal.addEventListener('click', (e) => {
      if (e.target === authModal) toggleModal();
    });

    // 2. CONTROL DEL BOTÓN PRINCIPAL (LOGIN / LOGOUT)
    authBtn.addEventListener('click', async () => {
      if (currentUser) {
        // Cerrar Sesión en Supabase
        await supabase.auth.signOut();
        updateUI(null);
      } else {
        toggleModal();
      }
    });

    // 3. INICIO DE SESIÓN CON SUPABASE
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      submitBtn.textContent = 'CARGANDO...';
      submitBtn.disabled = true;

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
      });

      submitBtn.textContent = 'ENTRAR';
      submitBtn.disabled = false;

      if (error) {
        errorMsg.textContent = error.message;
        errorMsg.style.display = 'block';
      } else {
        toggleModal();
        loginForm.reset();
      }
    });

    // 4. MANTENER Y ACTUALIZAR ESTADO DE LA SESIÓN
    const updateUI = (user) => {
      currentUser = user;
      if (user) {
        userStatus.textContent = `Sesión iniciada como: ${user.email}`;
        authBtn.textContent = 'Cerrar Sesión';
      } else {
        userStatus.textContent = 'Inicia sesión para acceder a tus tracks y colecciones.';
        authBtn.textContent = 'Iniciar Sesión';
      }
    };

    // Escuchar cambios de autenticación en tiempo real (al cargar la página o refrescar)
    supabase.auth.onAuthStateChange((event, session) => {
      const user = session?.user || null;
      updateUI(user);
    });
  </script>
</body>
</html>
