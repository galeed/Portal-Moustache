<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moustache de Chat App</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #ffffff;
      --bg-secondary: #f8f9fa;
      --text-main: #111111;
      --text-muted: #707070;
      --border-color: #e5e5e5;
      --accent-black: #000000;
      --error-color: #e53e3e;
      --success-color: #38a169;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* Header Navbar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      background: var(--bg-color);
      z-index: 10;
      min-height: 60px;
      flex-wrap: wrap;
      gap: 12px;
    }
    
    .logo {
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    
    .logo span {
      background: var(--accent-black);
      color: #fff;
      padding: 2px 6px;
      margin-left: 2px;
    }
    
    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .auth-btn, .action-btn {
      background: var(--accent-black);
      color: #fff;
      border: none;
      padding: 10px 16px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      border-radius: 2px;
      white-space: nowrap;
    }

    .action-btn.secondary {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }
    
    /* Dashboard Responsive Layout */
    .dashboard-container {
      display: flex;
      flex: 1;
      flex-direction: row;
    }

    /* Sidebar Lateral */
    aside.sidebar {
      width: 220px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .nav-list {
      list-style: none;
    }

    .nav-item-link {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      text-decoration: none;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.2s ease;
    }

    .nav-item-link:hover, .nav-item-link.active {
      color: var(--text-main);
      background: #ffffff;
      border-left-color: var(--accent-black);
    }

    /* Área Principal */
    main.content-area {
      flex: 1;
      padding: 24px;
      background: var(--bg-color);
      width: 100%;
    }

    .library-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
      gap: 12px;
      flex-wrap: wrap;
    }

    .library-title {
      font-size: 1.6rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }

    .search-bar {
      width: 100%;
      max-width: 220px;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      font-size: 0.85rem;
      outline: none;
    }

    /* Tabla de Archivos / Tracks */
    .tracks-table-container {
      width: 100%;
      overflow-x: auto;
    }

    table.tracks-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    table.tracks-table th {
      padding: 12px 16px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
    }

    table.tracks-table td {
      padding: 16px;
      font-size: 0.85rem;
      border-bottom: 1px solid var(--border-color);
      font-weight: 600;
    }

    /* Mensaje de Estado Vacío */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    .empty-state p {
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 16px;
      max-width: 300px;
      line-height: 1.4;
    }

    /* Modal de Autenticación */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.96);
      display: none; 
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 16px;
    }
    
    .modal-overlay.open {
      display: flex;
    }
    
    .modal-box {
      width: 100%;
      max-width: 380px;
      padding: 24px;
      border: 1px solid var(--border-color);
      background: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      position: relative;
    }
    
    .close-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      font-weight: 700;
    }
    
    .tabs {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }
    
    .tab-btn {
      background: none;
      border: none;
      font-size: 0.9rem;
      font-weight: 900;
      text-transform: uppercase;
      color: var(--text-muted);
      cursor: pointer;
      padding-bottom: 4px;
    }
    
    .tab-btn.active {
      color: var(--text-main);
      border-bottom: 2px solid var(--text-main);
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      background-color: #fff;
      color: var(--text-main);
    }
    
    .form-group input:focus {
      border-color: var(--text-main);
    }
    
    .submit-btn {
      width: 100%;
      background: var(--text-main);
      color: #fff;
      border: none;
      padding: 14px;
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      margin-top: 8px;
    }
    
    .msg-box {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 12px;
      display: none;
      word-break: break-word;
    }
    
    .msg-box.error { color: var(--error-color); }
    .msg-box.success { color: var(--success-color); }

    /* REGLAS RESPONSIVAS PARA MÓVILES */
    @media (max-width: 768px) {
      .dashboard-container {
        flex-direction: column;
      }

      aside.sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--border-color);
        padding: 0;
      }

      .nav-list {
        display: flex;
        overflow-x: auto;
        white-space: nowrap;
      }

      .nav-item-link {
        padding: 12px 16px;
        border-left: none;
        border-bottom: 3px solid transparent;
      }

      .nav-item-link:hover, .nav-item-link.active {
        border-left-color: transparent;
        border-bottom-color: var(--accent-black);
      }

      .search-bar {
        max-width: 100%;
      }

      main.content-area {
        padding: 16px;
      }

      .library-title {
        font-size: 1.3rem;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">MOUSTACHE<span>App</span></div>
    <div class="top-actions">
      <input type="text" class="search-bar" placeholder="Buscar...">
      <button class="auth-btn" id="authBtn">Iniciar Sesión</button>
    </div>
  </header>

  <div class="dashboard-container">
    <aside class="sidebar">
      <ul class="nav-list">
        <li><a class="nav-item-link active">Biblioteca</a></li>
        <li><a class="nav-item-link">Pistas</a></li>
        <li><a class="nav-item-link">Álbumes</a></li>
        <li><a class="nav-item-link">Procesamiento</a></li>
      </ul>
    </aside>

    <main class="content-area">
      <div class="library-header">
        <h1 class="library-title" id="libraryTitle">Biblioteca de Másters</h1>
        <button class="action-btn" id="uploadBtn">+ Nuevo Máster</button>
      </div>

      <div id="loggedOutView" class="empty-state">
        <p>Inicia sesión para acceder a tu biblioteca y procesar tus masters musicales.</p>
        <button class="action-btn" id="loginPromptBtn">Iniciar Sesión</button>
      </div>

      <div id="loggedInView" style="display: none;">
        <div class="tracks-table-container">
          <table class="tracks-table">
            <thead>
              <tr>
                <th><input type="checkbox"></th>
                <th>Nombre del Track</th>
                <th>Fecha</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody id="tracksList">
            </tbody>
          </table>
        </div>

        <div id="emptyLibraryMsg" class="empty-state" style="display: none;">
          <p>Sube una pista para empezar a masterizar</p>
          <button class="action-btn">+ Nuevo</button>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="authModal">
    <div class="modal-box">
      <button class="close-btn" id="closeAuth">×</button>

      <div class="tabs">
        <button class="tab-btn active" id="tabLogin">Acceso Email</button>
        <button class="tab-btn" id="tabRegister">Crear Cuenta</button>
      </div>

      <form id="authForm">
        <div class="form-group" id="usernameGroup" style="display: none;">
          <label for="username">Nombre de Usuario</label>
          <input type="text" id="username" placeholder="dj_producer" autocomplete="username">
        </div>

        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" required="" placeholder="tu@email.com" autocomplete="email">
        </div>

        <div class="form-group" id="passwordGroup">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required="" placeholder="••••••••" autocomplete="current-password">
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Entrar</button>
        <div class="msg-box" id="msgBox"></div>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://cwpjjzamawyywfcsnaqo.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_NynLf9J-n78PPW7Oaw2W1Q_0_kJjwtl';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let isRegisterMode = false;
    let currentUser = null;

    const authModal = document.getElementById('authModal');
    const authBtn = document.getElementById('authBtn');
    const closeAuthBtn = document.getElementById('closeAuth');
    const authForm = document.getElementById('authForm');
    const msgBox = document.getElementById('msgBox');
    const submitBtn = document.getElementById('submitBtn');
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const usernameGroup = document.getElementById('usernameGroup');
    const usernameInput = document.getElementById('username');
    
    const loggedOutView = document.getElementById('loggedOutView');
    const loggedInView = document.getElementById('loggedInView');
    const loginPromptBtn = document.getElementById('loginPromptBtn');
    const emptyLibraryMsg = document.getElementById('emptyLibraryMsg');

    const openModal = () => {
      msgBox.style.display = 'none';
      authModal.classList.add('open');
    };

    const closeModal = () => {
      authModal.classList.remove('open');
    };

    closeAuthBtn.addEventListener('click', closeModal);
    loginPromptBtn.addEventListener('click', openModal);
    authModal.addEventListener('click', (e) => {
      if (e.target === authModal) closeModal();
    });

    tabLogin.addEventListener('click', () => {
      isRegisterMode = false;
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      submitBtn.textContent = 'Entrar';
      usernameGroup.style.display = 'none';
      usernameInput.required = false;
      msgBox.style.display = 'none';
    });

    tabRegister.addEventListener('click', () => {
      isRegisterMode = true;
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      submitBtn.textContent = 'Crear Cuenta';
      usernameGroup.style.display = 'block';
      usernameInput.required = true;
      msgBox.style.display = 'none';
    });

    authBtn.addEventListener('click', async () => {
      if (currentUser) {
        await supabase.auth.signOut();
        updateUI(null);
      } else {
        openModal();
      }
    });

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      msgBox.style.display = 'none';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const username = usernameInput.value.trim();

      submitBtn.disabled = true;

      if (isRegisterMode) {
        submitBtn.textContent = 'REGISTRANDO...';

        const { data, error } = await supabase.auth.signUp({
          email: email,
          password: password,
          options: {
            data: { username: username }
          }
        });

        if (error) {
          showMsg(error.message, 'error');
        } else {
          showMsg('Cuenta creada correctamente. Revisa tu correo.', 'success');
          authForm.reset();
        }
      } else {
        submitBtn.textContent = 'AUTENTICANDO...';
        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          showMsg(error.message, 'error');
        } else {
          closeModal();
          authForm.reset();
        }
      }

      submitBtn.disabled = false;
      submitBtn.textContent = isRegisterMode ? 'Crear Cuenta' : 'Entrar';
    });

    function showMsg(text, type) {
      msgBox.textContent = text;
      msgBox.className = `msg-box ${type}`;
      msgBox.style.display = 'block';
    }

    const fetchProfile = async (user) => {
      if (!user) return null;
      const { data } = await supabase
        .from('profiles')
        .select('username')
        .eq('id', user.id)
        .single();

      if (data?.username) return data.username;
      return user.user_metadata?.username || user.email;
    };

    const updateUI = async (user) => {
      currentUser = user;
      if (user) {
        const displayName = await fetchProfile(user);
        authBtn.textContent = 'Cerrar Sesión';
        loggedOutView.style.display = 'none';
        loggedInView.style.display = 'block';
        emptyLibraryMsg.style.display = 'flex';
      } else {
        authBtn.textContent = 'Iniciar Sesión';
        loggedOutView.style.display = 'flex';
        loggedInView.style.display = 'none';
      }
    };

    supabase.auth.onAuthStateChange((event, session) => {
      updateUI(session?.user || null);
    });
  </script>

</body>

</html>
