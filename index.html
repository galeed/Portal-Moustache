<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moustache de Chat App</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-main: #111111;
      --text-muted: #707070;
      --border-color: #e5e5e5;
      --accent-black: #000000;
      --error-color: #e53e3e;
      --success-color: #38a169;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      padding-bottom: 80px;
      -webkit-font-smoothing: antialiased;
    }
    
    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      background: var(--bg-color);
      z-index: 10;
    }
    
    .logo {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }
    
    .logo span {
      background: var(--accent-black);
      color: #fff;
      padding: 2px 6px;
      margin-left: 2px;
    }
    
    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .auth-btn {
      background: var(--accent-black);
      color: #fff;
      border: none;
      padding: 10px 18px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-radius: 2px;
    }
    
    /* Main Layout */
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    
    .hero-title {
      font-size: 2.2rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }
    
    .subtitle {
      color: var(--text-muted);
      margin-bottom: 32px;
      font-size: 0.95rem;
    }
    
    /* Grid de Contenido */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
    }
    
    .card {
      border: 1px solid var(--border-color);
      padding: 16px;
      background: #fff;
    }
    
    .card-img {
      width: 100%;
      aspect-ratio: 1/1;
      background-color: #f0f0f0;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      font-weight: 700;
    }
    
    .card-title {
      font-size: 1rem;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    
    .card-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    
    /* Barra Fija Inferior */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background-color: var(--bg-color);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 20;
    }
    
    .nav-item {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .nav-item.active {
      color: var(--text-main);
    }
    
    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.96);
      display: none; 
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    
    .modal-overlay.open {
      display: flex;
    }
    
    .modal-box {
      width: 100%;
      max-width: 380px;
      padding: 32px;
      border: 1px solid var(--border-color);
      background: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      position: relative;
    }
    
    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      font-size: 1.4rem;
      font-weight: 700;
    }
    
    /* Pestañas */
    .tabs {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }
    
    .tab-btn {
      background: none;
      border: none;
      font-size: 1rem;
      font-weight: 900;
      text-transform: uppercase;
      color: var(--text-muted);
      padding-bottom: 4px;
    }
    
    .tab-btn.active {
      color: var(--text-main);
      border-bottom: 2px solid var(--text-main);
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      background-color: #fff;
      color: var(--text-main);
    }
    
    .form-group input:focus {
      border-color: var(--text-main);
    }
    
    .submit-btn {
      width: 100%;
      background: var(--text-main);
      color: #fff;
      border: none;
      padding: 14px;
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 8px;
    }
    
    .msg-box {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 12px;
      display: none;
      word-break: break-word;
    }
    
    .msg-box.error { color: var(--error-color); }
    .msg-box.success { color: var(--success-color); }
  </style>
</head>

<body>

  <header>
    <div class="logo">MOUSTACHE<span>App</span></div>
    <button class="auth-btn" id="authBtn" type="button">Iniciar Sesión</button>
  </header>

  <main>
    <h1 class="hero-title">Mi Perfil</h1>
    <p class="subtitle" id="userStatus">Inicia sesión para acceder a tus tracks y colecciones.</p>

    <div class="grid">
      <div class="card">
        <div class="card-img">Artwork 1:1</div>
        <div class="card-title">Track Title</div>
        <div class="card-meta">Artist • Genre</div>
      </div>
      <div class="card">
        <div class="card-img">Artwork 1:1</div>
        <div class="card-title">Release Title</div>
        <div class="card-meta">Label • 128 BPM</div>
      </div>
      <div class="card">
        <div class="card-img">Artwork 1:1</div>
        <div class="card-title">Playlist</div>
        <div class="card-meta">12 Tracks</div>
      </div>
    </div>
  </main>

  <nav class="bottom-bar">
    <button class="nav-item active" type="button">Explorar</button>
    <button class="nav-item" type="button">Top 100</button>
    <button class="nav-item" type="button">Lanzamientos</button>
    <button class="nav-item" id="bottomProfileBtn" type="button">Perfil</button>
  </nav>

  <div class="modal-overlay" id="authModal">
    <div class="modal-box">
      <button class="close-btn" id="closeAuth" type="button">×</button>

      <div class="tabs">
        <button class="tab-btn active" id="tabLogin" type="button">Acceso Email</button>
        <button class="tab-btn" id="tabRegister" type="button">Crear Cuenta</button>
      </div>

      <form id="authForm">
        <div class="form-group" id="usernameGroup" style="display: none;">
          <label for="username">Nombre de Usuario</label>
          <input type="text" id="username" placeholder="dj_producer" autocomplete="username">
        </div>

        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" required="" placeholder="tu@email.com" autocomplete="email">
        </div>

        <div class="form-group" id="passwordGroup">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required="" placeholder="••••••••" autocomplete="current-password">
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Entrar</button>
        <div class="msg-box" id="msgBox"></div>
      </form>
    </div>
  </div>

  <script>
    // Variables globales de estado
    let isRegisterMode = false;
    let currentUser = null;
    let sb = null;

    // Referencias al DOM
    const authModal = document.getElementById('authModal');
    const authBtn = document.getElementById('authBtn');
    const closeAuthBtn = document.getElementById('closeAuth');
    const bottomProfileBtn = document.getElementById('bottomProfileBtn');
    const authForm = document.getElementById('authForm');
    const userStatus = document.getElementById('userStatus');
    const msgBox = document.getElementById('msgBox');
    const submitBtn = document.getElementById('submitBtn');
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const usernameGroup = document.getElementById('usernameGroup');
    const usernameInput = document.getElementById('username');

    // 1. REGISTRO DE EVENTOS DOM (Se ejecutan ANTES de cualquier llamada remota)
    const openModal = () => {
      msgBox.style.display = 'none';
      authModal.classList.add('open');
    };

    const closeModal = () => {
      authModal.classList.remove('open');
    };

    // Funciones asociadas a los clics e interacciones de pantalla táctil
    const handleOpenClick = (e) => {
      if (e) e.preventDefault();
      if (!currentUser) openModal();
    };

    authBtn.addEventListener('click', (e) => {
      e.preventDefault();
      if (currentUser && sb) {
        sb.auth.signOut().then(() => updateUI(null));
      } else {
        openModal();
      }
    });

    bottomProfileBtn.addEventListener('click', handleOpenClick);
    closeAuthBtn.addEventListener('click', closeModal);

    authModal.addEventListener('click', (e) => {
      if (e.target === authModal) closeModal();
    });

    tabLogin.addEventListener('click', (e) => {
      e.preventDefault();
      isRegisterMode = false;
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      submitBtn.textContent = 'Entrar';
      usernameGroup.style.display = 'none';
      usernameInput.required = false;
      msgBox.style.display = 'none';
    });

    tabRegister.addEventListener('click', (e) => {
      e.preventDefault();
      isRegisterMode = true;
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      submitBtn.textContent = 'Crear Cuenta';
      usernameGroup.style.display = 'block';
      usernameInput.required = true;
      msgBox.style.display = 'none';
    });

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      msgBox.style.display = 'none';

      if (!sb) {
        showMsg("Atención: Clave o cliente Supabase no disponible.", "error");
        return;
      }

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const username = usernameInput.value.trim();

      submitBtn.disabled = true;

      try {
        if (isRegisterMode) {
          submitBtn.textContent = 'REGISTRANDO...';
          const { data, error } = await sb.auth.signUp({
            email: email,
            password: password,
            options: { data: { username: username } }
          });

          if (error) {
            showMsg(error.message, 'error');
          } else {
            showMsg('Cuenta creada correctamente.', 'success');
            authForm.reset();
          }
        } else {
          submitBtn.textContent = 'AUTENTICANDO...';
          const { data, error } = await sb.auth.signInWithPassword({
            email,
            password
          });

          if (error) {
            showMsg(error.message, 'error');
          } else {
            closeModal();
            authForm.reset();
          }
        }
      } catch (err) {
        showMsg("Error de autenticación.", "error");
      }

      submitBtn.disabled = false;
      submitBtn.textContent = isRegisterMode ? 'Crear Cuenta' : 'Entrar';
    });

    function showMsg(text, type) {
      msgBox.textContent = text;
      msgBox.className = `msg-box ${type}`;
      msgBox.style.display = 'block';
    }

    const updateUI = (user) => {
      currentUser = user;
      if (user) {
        const displayName = user.user_metadata?.username || user.email;
        userStatus.textContent = `Sesión activa: @${displayName}`;
        authBtn.textContent = 'Cerrar Sesión';
      } else {
        userStatus.textContent = 'Inicia sesión para acceder a tus tracks y colecciones.';
        authBtn.textContent = 'Iniciar Sesión';
      }
    };

    // 2. INICIALIZACIÓN ASÍNCRONA DE SUPABASE
    window.addEventListener('DOMContentLoaded', () => {
      const SUPABASE_URL = 'https://cwpjjzamawyywfcsnaqo.supabase.co';
      const SUPABASE_ANON_KEY = 'sb_publishable_NynLf9J-n78PPW7Oaw2W1Q_0_kJjwtl';

      try {
        if (window.supabase && typeof window.supabase.createClient === 'function') {
          sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          sb.auth.onAuthStateChange((event, session) => {
            updateUI(session?.user || null);
          });
        }
      } catch (err) {
        console.warn("No se pudo iniciar Supabase:", err);
      }
    });
  </script>

</body>

</html>
